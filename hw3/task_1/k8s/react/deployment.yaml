apiVersion: apps/v1
kind: Deployment
metadata:
  name: react
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react
  template:
    metadata:
      labels:
        app: react
    spec:
      containers:
        - name: react
          image: fastapi-react-postgres-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

          volumeMounts:
                - name: nginx-config
                  mountPath: /etc/nginx/conf.d/default.conf
                  subPath: default.conf

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config