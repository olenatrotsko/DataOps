apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: flask-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9091
          env:
            - name: FLASK_SERVER_PORT
              value: "9091"
            - name: MONGO_URI
              value: "mongodb://mongo:27017"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "kill -INT 1; sleep 5"]
